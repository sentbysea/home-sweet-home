<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcfbf8">
  <title>home sweet home</title>
  <link rel="preload" href="src/fonts/nanum-gothic-coding-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="src/fonts/nanum-gothic-coding-status.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/loader.css">
  <link rel="stylesheet" href="src/styles/plan.css">
  <noscript><style>.hsh-loader__text { visibility: visible; }</style></noscript>
</head>
<body>
  <!-- 로딩 화면 — 이식할 때는 이 블록 + loader.css + src/loader/ 를 옮긴다 -->
  <div class="hsh-loader">
    <!-- 배경 — 아이보리 바탕에 별. 불러올 때마다 위치·기울기 무작위(아래 인라인 스크립트) -->
    <svg class="hsh-bg" aria-hidden="true" focusable="false">
      <defs>
        <path id="hsh-star" d="M0 -4.4L1.12 -1.54L4.18 -1.36L1.81 0.59L2.59 3.56L0 1.9L-2.59 3.56L-1.81 0.59L-4.18 -1.36L-1.12 -1.54Z"/>
      </defs>
      <g class="hsh-bg__stars" id="hsh-stars"></g>
    </svg>
    <script>
      // 66px 칸마다 별 하나 — 칸 안 아무 데나, 기울기도 무작위. 첫 화면 전에 그리려고 인라인.
      // 가로·세로 중 긴 쪽 기준 정사각형으로 깔아 화면을 돌려도 빈 곳이 없다.
      (function () {
        var CELL = 66, PAD = 10;
        var side = Math.max(innerWidth, innerHeight, screen.width, screen.height);
        var n = Math.ceil(side / CELL) + 1;
        var g = document.getElementById("hsh-stars");
        var frag = document.createDocumentFragment();
        for (var row = 0; row < n; row++) {
          for (var col = 0; col < n; col++) {
            var x = col * CELL + PAD + Math.random() * (CELL - PAD * 2);
            var y = row * CELL + PAD + Math.random() * (CELL - PAD * 2);
            var a = Math.random() * 50 - 25;
            var star = document.createElementNS("http://www.w3.org/2000/svg", "use");
            star.setAttribute("href", "#hsh-star");
            star.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + a.toFixed(0) + ")");
            frag.appendChild(star);
          }
        }
        g.appendChild(frag);
      })();
    </script>
    <div class="hsh-loader__stage">
      <svg class="hsh-loader__house" viewBox="0 0 340 318" aria-hidden="true" focusable="false">
        <!-- 손그림 윤곽 4장 — tools/wobble.mjs 로 만든다 -->
        <g class="hsh-loader__boil">
          <path class="hsh-loader__frame" d="M169.1 4.2Q251.7 77.4 334.5 150.5Q305.6 151.7 276.8 153.2Q276.1 233.5 274.5 313.8Q164.6 313 54.6 312Q56.5 231.6 57 151.2Q30.8 151.5 4.5 151.5Q85.8 76.7 169.1 4.2Z"/>
          <path class="hsh-loader__frame" d="M169.1 4.5Q252.8 77.6 335.2 152.1Q306 153 276.7 153.1Q277 233.4 275.2 313.7Q165.1 313.4 55 314.4Q54 233.2 55.1 152Q29.3 153.1 3.5 153Q86.1 78.5 169.1 4.5Z"/>
          <path class="hsh-loader__frame" d="M169.1 5.5Q251.6 77.8 333.8 150.4Q304.1 150.4 274.4 151.3Q275.3 232.2 275.3 313.1Q165.3 311.9 55.4 313.7Q55.6 232.1 56.3 150.5Q31.1 150.6 5.9 150.6Q86.4 76.8 169.1 5.5Z"/>
          <path class="hsh-loader__frame" d="M169.1 3.6Q252.4 76.8 333.6 152.5Q305.2 152.2 276.7 151.1Q274.5 231.5 274.9 311.9Q165.4 314.2 55.9 313.4Q55.4 231.9 57.2 150.4Q30.9 150.7 4.6 151.4Q85.9 76.4 169.1 3.6Z"/>
        </g>
        <!-- 글자는 처음부터 제자리에 놓고, 한 글자씩 보이게만 한다 -->
        <text class="hsh-loader__text" x="81">
          <tspan x="81" y="200" data-type-line>home</tspan>
          <tspan x="81" y="241" data-type-line>sweet</tspan>
          <tspan x="81" y="282" data-type-line>home</tspan><tspan data-type-line data-type-slow>...</tspan>
        </text>
      </svg>

      <!-- 방문 단계 — status.js 가 data-step 과 글을 바꾼다 -->
      <p class="hsh-status" data-step="bell" role="status" aria-live="polite">
        <svg class="hsh-status__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g class="hsh-icon hsh-icon--bell">
            <g class="hsh-bell">
              <path d="M12 4.5c-2.9 0-4.8 2.3-4.8 5.2v3.4l-1.6 2.5h12.8l-1.6-2.5V9.7c0-2.9-1.9-5.2-4.8-5.2z"/>
              <path d="M12 3v1.5"/>
              <circle cx="12" cy="17.6" r="1.4"/>
            </g>
            <path class="hsh-ring" d="M3.6 8.2c-.9 1.6-.9 3.6 0 5.2"/>
            <path class="hsh-ring" d="M20.4 8.2c.9 1.6.9 3.6 0 5.2"/>
          </g>
          <g class="hsh-icon hsh-icon--run">
            <path class="hsh-run__speed" d="M2 9.5h3M1 13h3.5"/>
            <g class="hsh-run__body">
              <circle cx="14" cy="4.6" r="2"/>
              <path d="M13.2 7.6l-1.7 5.6"/>
              <path class="hsh-run__a" d="M12.7 9.4l3 1.7M12.7 9.4l-3 .9M11.5 13.2l2.6 3.2-1 3.6M11.5 13.2l-2.7 2.9-2.6-.5"/>
              <path class="hsh-run__b" d="M12.7 9.4l-2.3 2.6M12.7 9.4l2.6-1.6M11.5 13.2l-1 4-2.4 2.4M11.5 13.2l3 2 1.4 2.6"/>
            </g>
          </g>
          <g class="hsh-icon hsh-icon--door">
            <rect class="hsh-door__gap" x="6.5" y="3.5" width="11" height="17"/>
            <g class="hsh-door__panel">
              <rect x="6.5" y="3.5" width="11" height="17"/>
              <circle cx="15" cy="12.5" r=".9"/>
            </g>
            <path d="M4 20.5h16"/>
          </g>
          <g class="hsh-icon hsh-icon--tap">
            <circle class="hsh-tap" cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1.6"/>
          </g>
        </svg>
        <span class="hsh-status__text">초인종 누르는 중</span>
      </p>
    </div>
  </div>

  <!-- 로딩 다음 — 평면도. SVG 는 src/plan/floorplan.svg 를 넣는다 -->
  <main id="app" hidden>
    <div class="hsh-plan" hidden>
      <div class="hsh-clock" role="img" aria-label="한국 시각"></div>
      <div class="hsh-plan__card"></div>
      <p class="hsh-plan__hint" aria-hidden="true">click the (<svg class="hsh-plan__hint-icon" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="-34 -34 68 68"></svg>)</p>
    </div>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
