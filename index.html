<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>home sweet home</title>
  <link rel="preload" href="src/fonts/nanum-gothic-coding-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="src/fonts/nanum-gothic-coding-status.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/loader.css">
  <noscript><style>.hsh-loader__text { visibility: visible; }</style></noscript>
</head>
<body>
  <!-- 로딩 화면 — 이식할 때는 이 블록 + loader.css + src/loader/ 를 옮긴다 -->
  <div class="hsh-loader">
    <!-- 배경 패턴 — 소용돌이 · 물방울 · 줄무늬 · 깅엄 중 하나(data-bg). 손그림 번짐은 #hsh-paint -->
    <svg class="hsh-bg" data-bg="gingham" aria-hidden="true" focusable="false">
      <defs>
        <filter id="hsh-paint" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <pattern id="hsh-bg-dots" width="64" height="64" patternUnits="userSpaceOnUse">
          <circle cx="16" cy="16" r="7"/>
          <circle cx="48" cy="48" r="7"/>
        </pattern>
        <pattern id="hsh-bg-stripes" width="150" height="10" patternUnits="userSpaceOnUse">
          <rect x="0" width="26" height="10"/>
          <rect x="44" width="12" height="10" opacity=".55"/>
          <rect x="78" width="30" height="10" opacity=".8"/>
          <rect x="126" width="9" height="10" opacity=".45"/>
        </pattern>
        <pattern id="hsh-bg-gingham" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="44" height="18" opacity=".5"/>
          <rect width="18" height="44" opacity=".5"/>
        </pattern>
      </defs>
      <g class="hsh-bg__paint" filter="url(#hsh-paint)">
        <rect class="hsh-bg__fill hsh-bg__fill--dots" width="100%" height="100%" fill="url(#hsh-bg-dots)"/>
        <rect class="hsh-bg__fill hsh-bg__fill--stripes" width="100%" height="100%" fill="url(#hsh-bg-stripes)"/>
        <rect class="hsh-bg__fill hsh-bg__fill--gingham" width="100%" height="100%" fill="url(#hsh-bg-gingham)"/>
        <svg class="hsh-bg__fill hsh-bg__fill--spiral" viewBox="-640 -400 1280 800" preserveAspectRatio="xMidYMid slice">
          <!-- tools/spiral.mjs 로 만든다 -->
          <path class="hsh-bg__spiral" d="M8.5 0A17 17 0 0 0 -25.5 0A34 34 0 0 0 42.5 0A51 51 0 0 0 -59.5 0A68 68 0 0 0 76.5 0A85 85 0 0 0 -93.5 0A102 102 0 0 0 110.5 0A119 119 0 0 0 -127.5 0A136 136 0 0 0 144.5 0A153 153 0 0 0 -161.5 0A170 170 0 0 0 178.5 0A187 187 0 0 0 -195.5 0A204 204 0 0 0 212.5 0A221 221 0 0 0 -229.5 0A238 238 0 0 0 246.5 0A255 255 0 0 0 -263.5 0A272 272 0 0 0 280.5 0A289 289 0 0 0 -297.5 0A306 306 0 0 0 314.5 0A323 323 0 0 0 -331.5 0A340 340 0 0 0 348.5 0A357 357 0 0 0 -365.5 0A374 374 0 0 0 382.5 0A391 391 0 0 0 -399.5 0A408 408 0 0 0 416.5 0A425 425 0 0 0 -433.5 0A442 442 0 0 0 450.5 0A459 459 0 0 0 -467.5 0A476 476 0 0 0 484.5 0A493 493 0 0 0 -501.5 0A510 510 0 0 0 518.5 0A527 527 0 0 0 -535.5 0A544 544 0 0 0 552.5 0A561 561 0 0 0 -569.5 0A578 578 0 0 0 586.5 0A595 595 0 0 0 -603.5 0A612 612 0 0 0 620.5 0A629 629 0 0 0 -637.5 0A646 646 0 0 0 654.5 0A663 663 0 0 0 -671.5 0A680 680 0 0 0 688.5 0A697 697 0 0 0 -705.5 0A714 714 0 0 0 722.5 0A731 731 0 0 0 -739.5 0A748 748 0 0 0 756.5 0A765 765 0 0 0 -773.5 0A782 782 0 0 0 790.5 0A799 799 0 0 0 -807.5 0"/>
        </svg>
      </g>
    </svg>
    <!-- ?bg=spiral|dots|stripes|gingham 로 고정, 없으면 무작위. 첫 화면 전에 정하려고 인라인 -->
    <script>
      (function () {
        var all = ["spiral", "dots", "stripes", "gingham"];
        var want = new URLSearchParams(location.search).get("bg");
        document.querySelector(".hsh-bg").dataset.bg =
          all.indexOf(want) >= 0 ? want : all[Math.floor(Math.random() * all.length)];
      })();
    </script>
    <div class="hsh-loader__stage">
      <svg class="hsh-loader__house" viewBox="0 0 340 318" aria-hidden="true" focusable="false">
        <!-- 손그림 윤곽 4장 — tools/wobble.mjs 로 만든다 -->
        <g class="hsh-loader__boil">
          <path class="hsh-loader__frame" d="M169.1 4.2Q251.7 77.4 334.5 150.5Q305.6 151.7 276.8 153.2Q276.1 233.5 274.5 313.8Q164.6 313 54.6 312Q56.5 231.6 57 151.2Q30.8 151.5 4.5 151.5Q85.8 76.7 169.1 4.2Z"/>
          <path class="hsh-loader__frame" d="M169.1 4.5Q252.8 77.6 335.2 152.1Q306 153 276.7 153.1Q277 233.4 275.2 313.7Q165.1 313.4 55 314.4Q54 233.2 55.1 152Q29.3 153.1 3.5 153Q86.1 78.5 169.1 4.5Z"/>
          <path class="hsh-loader__frame" d="M169.1 5.5Q251.6 77.8 333.8 150.4Q304.1 150.4 274.4 151.3Q275.3 232.2 275.3 313.1Q165.3 311.9 55.4 313.7Q55.6 232.1 56.3 150.5Q31.1 150.6 5.9 150.6Q86.4 76.8 169.1 5.5Z"/>
          <path class="hsh-loader__frame" d="M169.1 3.6Q252.4 76.8 333.6 152.5Q305.2 152.2 276.7 151.1Q274.5 231.5 274.9 311.9Q165.4 314.2 55.9 313.4Q55.4 231.9 57.2 150.4Q30.9 150.7 4.6 151.4Q85.9 76.4 169.1 3.6Z"/>
        </g>
        <!-- 글자는 처음부터 제자리에 놓고, 한 글자씩 보이게만 한다 -->
        <text class="hsh-loader__text" x="81">
          <tspan x="81" y="202" data-type-line>home</tspan>
          <tspan x="81" y="239" data-type-line>sweet</tspan>
          <tspan x="81" y="276" data-type-line>home</tspan><tspan data-type-line data-type-slow>...</tspan>
        </text>
      </svg>

      <!-- 방문 단계 — status.js 가 data-step 과 글을 바꾼다 -->
      <p class="hsh-status" data-step="bell" role="status" aria-live="polite">
        <svg class="hsh-status__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g class="hsh-icon hsh-icon--bell">
            <g class="hsh-bell">
              <path d="M12 4.5c-2.9 0-4.8 2.3-4.8 5.2v3.4l-1.6 2.5h12.8l-1.6-2.5V9.7c0-2.9-1.9-5.2-4.8-5.2z"/>
              <path d="M12 3v1.5"/>
              <circle cx="12" cy="17.6" r="1.4"/>
            </g>
            <path class="hsh-ring" d="M3.6 8.2c-.9 1.6-.9 3.6 0 5.2"/>
            <path class="hsh-ring" d="M20.4 8.2c.9 1.6.9 3.6 0 5.2"/>
          </g>
          <g class="hsh-icon hsh-icon--run">
            <path class="hsh-run__speed" d="M2 9.5h3M1 13h3.5"/>
            <g class="hsh-run__body">
              <circle cx="14" cy="4.6" r="2"/>
              <path d="M13.2 7.6l-1.7 5.6"/>
              <path class="hsh-run__a" d="M12.7 9.4l3 1.7M12.7 9.4l-3 .9M11.5 13.2l2.6 3.2-1 3.6M11.5 13.2l-2.7 2.9-2.6-.5"/>
              <path class="hsh-run__b" d="M12.7 9.4l-2.3 2.6M12.7 9.4l2.6-1.6M11.5 13.2l-1 4-2.4 2.4M11.5 13.2l3 2 1.4 2.6"/>
            </g>
          </g>
          <g class="hsh-icon hsh-icon--door">
            <rect class="hsh-door__gap" x="6.5" y="3.5" width="11" height="17"/>
            <g class="hsh-door__panel">
              <rect x="6.5" y="3.5" width="11" height="17"/>
              <circle cx="15" cy="12.5" r=".9"/>
            </g>
            <path d="M4 20.5h16"/>
          </g>
          <g class="hsh-icon hsh-icon--tap">
            <circle class="hsh-tap" cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1.6"/>
          </g>
        </svg>
        <span class="hsh-status__text">초인종 누르는 중</span>
      </p>
    </div>

    <!-- 손그림 위글(집 안 글자 · 아래 작은 글) — 노이즈 seed 를 190ms 마다 바꾼다 -->
    <svg class="hsh-defs" aria-hidden="true" focusable="false">
      <filter id="hsh-wobble" x="-10%" y="-40%" width="120%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.074" numOctaves="1" seed="1" result="noise">
          <animate attributeName="seed" values="1;5;9;13" dur="0.76s" calcMode="discrete" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
  </div>

  <!-- 로딩이 끝나면 보일 자리(지금은 빈 흰 화면) -->
  <main id="app" hidden></main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
