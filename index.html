<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>home sweet home</title>
  <link rel="preload" href="src/fonts/nanum-gothic-coding-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="src/fonts/nanum-gothic-coding-status.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/loader.css">
  <noscript><style>.hsh-loader__text { visibility: visible; }</style></noscript>
</head>
<body>
  <!-- 로딩 화면 — 이식할 때는 이 블록 + loader.css + src/loader/ 를 옮긴다 -->
  <div class="hsh-loader">
    <div class="hsh-loader__stage">
      <svg class="hsh-loader__house" viewBox="0 0 340 318" aria-hidden="true" focusable="false">
        <!-- 손그림 윤곽 4장 — tools/wobble.mjs 로 만든다 -->
        <g class="hsh-loader__boil">
          <path class="hsh-loader__frame" d="M169.3 4.4Q251.9 77.7 334.6 150.9Q305.6 151.7 276.6 152.9Q276.1 233.2 274.9 313.6Q164.9 313 55 312.3Q56.4 231.8 56.7 151.4Q30.7 151.6 4.6 151.6Q86.2 77.1 169.3 4.4Z"/>
          <path class="hsh-loader__frame" d="M169.3 4.6Q252.8 77.8 335.2 152.1Q305.9 152.8 276.6 152.8Q276.8 233.2 275.4 313.6Q165.3 313.3 55.2 314Q54.5 233 55.3 152Q29.6 152.8 3.9 152.7Q86.5 78.5 169.3 4.6Z"/>
          <path class="hsh-loader__frame" d="M169.4 5.3Q251.8 78 334.1 150.8Q304.5 150.8 274.8 151.4Q275.5 232.3 275.5 313.1Q165.5 312.1 55.6 313.5Q55.7 232.2 56.2 150.9Q30.9 151 5.7 151Q86.6 77.2 169.4 5.3Z"/>
          <path class="hsh-loader__frame" d="M169.4 3.9Q252.5 77.2 334 152.3Q305.3 152.2 276.5 151.4Q274.8 231.8 275.2 312.2Q165.6 314 55.9 313.3Q55.5 232.1 56.9 150.8Q30.8 151 4.7 151.6Q86.3 76.9 169.4 3.9Z"/>
        </g>
        <!-- 글자는 처음부터 제자리에 놓고, 한 글자씩 보이게만 한다 -->
        <text class="hsh-loader__text" x="81">
          <tspan x="81" y="202" data-type-line>home</tspan>
          <tspan x="81" y="239" data-type-line>sweet</tspan>
          <tspan x="81" y="276" data-type-line>home</tspan><tspan data-type-line data-type-slow>...</tspan>
        </text>
      </svg>

      <!-- 방문 단계 — status.js 가 data-step 과 글을 바꾼다 -->
      <p class="hsh-status" data-step="bell" role="status" aria-live="polite">
        <svg class="hsh-status__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g class="hsh-icon hsh-icon--bell">
            <g class="hsh-bell">
              <path d="M12 4.5c-2.9 0-4.8 2.3-4.8 5.2v3.4l-1.6 2.5h12.8l-1.6-2.5V9.7c0-2.9-1.9-5.2-4.8-5.2z"/>
              <path d="M12 3v1.5"/>
              <circle cx="12" cy="17.6" r="1.4"/>
            </g>
            <path class="hsh-ring" d="M3.6 8.2c-.9 1.6-.9 3.6 0 5.2"/>
            <path class="hsh-ring" d="M20.4 8.2c.9 1.6.9 3.6 0 5.2"/>
          </g>
          <g class="hsh-icon hsh-icon--door">
            <rect class="hsh-door__gap" x="6.5" y="3.5" width="11" height="17"/>
            <g class="hsh-door__panel">
              <rect x="6.5" y="3.5" width="11" height="17"/>
              <circle cx="15" cy="12.5" r=".9"/>
            </g>
            <path d="M4 20.5h16"/>
          </g>
          <g class="hsh-icon hsh-icon--shoes">
            <g class="hsh-shoe"><path d="M2.5 17.5v-3.4c0-.5.4-.9.9-.9h1.4l1.5 1.7h2.8c1 0 1.9.8 1.9 1.8v.8z"/></g>
            <g transform="translate(10.5 0)"><g class="hsh-shoe hsh-shoe--late"><path d="M2.5 17.5v-3.4c0-.5.4-.9.9-.9h1.4l1.5 1.7h2.8c1 0 1.9.8 1.9 1.8v.8z"/></g></g>
            <path d="M1.5 19h21"/>
          </g>
          <g class="hsh-icon hsh-icon--enter">
            <path class="hsh-enter" d="M18.5 6.5V12H7m3-3-3 3 3 3"/>
          </g>
          <g class="hsh-icon hsh-icon--tap">
            <circle class="hsh-tap" cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1.6"/>
          </g>
        </svg>
        <span class="hsh-status__text">초인종 누르는 중</span>
      </p>
    </div>

    <!-- 글·아이콘 손그림 위글 — 노이즈 seed 를 190ms 마다 바꾼다 -->
    <svg class="hsh-defs" aria-hidden="true" focusable="false">
      <filter id="hsh-wobble" x="-10%" y="-40%" width="120%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="1" seed="1" result="noise">
          <animate attributeName="seed" values="1;5;9;13" dur="0.76s" calcMode="discrete" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
  </div>

  <!-- 로딩이 끝나면 보일 자리(지금은 빈 흰 화면) -->
  <main id="app" hidden></main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
